# Matrix Synapse за reverse proxy (Docker публикует Synapse на 127.0.0.1:8008).
# Установка: sudo cp matrix/nginx/matrix.fairyland.world.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/matrix.fairyland.world.conf /etc/nginx/sites-enabled/
# Сертификаты (certbot): sudo certbot certonly --nginx -d matrix.fairyland.world
# Проверка: sudo nginx -t && sudo systemctl reload nginx

# Редирект HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name matrix.fairyland.world;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix.fairyland.world;

    ssl_certificate     /etc/letsencrypt/live/matrix.fairyland.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix.fairyland.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Загрузка медиа в Synapse
    client_max_body_size 50M;

    # Долгий sync и федерация
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # WebSocket (sync и др.)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# В http-блоке nginx.conf должна быть строка (один раз на весь nginx):
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
