# Synapse Admin (Docker: порты "8010:80" → http://127.0.0.1:8010).
# Установка: sudo cp matrix/nginx/matrix-admin.fairyland.world.conf /etc/nginx/sites-available/
#           sudo ln -sf /etc/nginx/sites-available/matrix-admin.fairyland.world.conf /etc/nginx/sites-enabled/
# Сертификат: sudo certbot certonly --nginx -d matrix-admin.fairyland.world
# Проверка: sudo nginx -t && sudo systemctl reload nginx
#
# В интерфейсе админки укажите homeserver: https://matrix.fairyland.world
# Рекомендуется ограничить доступ (VPN, allow/deny по IP, basic auth) — админка не для публики.

server {
    listen 80;
    listen [::]:80;
    server_name matrix-admin.fairyland.world;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name matrix-admin.fairyland.world;

    ssl_certificate     /etc/letsencrypt/live/matrix-admin.fairyland.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matrix-admin.fairyland.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Нужен map $connection_upgrade (см. matrix/nginx/00-matrix-upgrade-map.conf).
