# Подключите внутри http { } в /etc/nginx/nginx.conf (или через include из conf.d):
#   include /etc/nginx/conf.d/00-matrix-upgrade-map.conf;
#
# Либо скопируйте в /etc/nginx/conf.d/ если у вас уже есть
#   include /etc/nginx/conf.d/*.conf;
# внутри http { }.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
