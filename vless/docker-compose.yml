version: "3"
services:
  3x-ui:
    image: ghcr.io/mhsanaei/3x-ui:latest
    container_name: 3x-ui
    restart: unless-stopped
    environment:
      - XRAY_VMESS_AEAD_FORCED=false
    volumes:
      - ./db:/etc/x-ui
      - ./cert:/etc/cert
      - ./logs:/var/log
    ports:
      - "54321:54321"  # Порт панели (Хост:Контейнер)
      - "2053:2053"    # Порт прокси (Выберите свободный!)
      # - "443:443"    # ТОЛЬКО если порт 443 свободен на сервере
    security_opt:
      - no-new-privileges:true